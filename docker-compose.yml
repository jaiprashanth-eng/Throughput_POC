services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poc_db
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  # MockPriceAPI runs in-process (not a separate container).
  # Tune latency/failure via env vars on the Django/Celery process:
  #   MOCK_API_LATENCY_MS, MOCK_API_JITTER_MS, MOCK_API_FAILURE_RATE

volumes:
  postgres_data:
